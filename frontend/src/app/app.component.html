<mat-toolbar color="primary">
  <span class="title">MEI Lembretes</span>
  <span class="spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/dashboard">Dashboard</a>
    <a mat-button routerLink="/faturamento">Faturamento</a>
    <a mat-button routerLink="/settings">Configurações</a>
    <button mat-button (click)="logout()">Sair</button>
  </nav>

  <button
    mat-icon-button
    class="nav-menu-trigger"
    [matMenuTriggerFor]="navMenu"
    aria-label="Abrir menu"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #navMenu="matMenu">
    <a mat-menu-item routerLink="/dashboard">Dashboard</a>
    <a mat-menu-item routerLink="/faturamento">Faturamento</a>
    <a mat-menu-item routerLink="/settings">Configurações</a>
    <button mat-menu-item (click)="logout()">Sair</button>
  </mat-menu>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>

<app-tour-overlay />
